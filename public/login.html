<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <meta name="author" content="SMM Vault" />
    <meta name="keywords" content="SMM panel login, social media marketing dashboard, SMM Vault account" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="theme-color" content="#102622" />
    <meta
      name="description"
      content="SMM Vault is a premium social media marketing panel for reliable campaign delivery, clear pricing, and order control."
    />
    <meta property="og:title" content="Sign in · SMM Vault" />
    <meta
      property="og:description"
      content="Manage social media marketing campaigns with SMM Vault."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SMM Vault" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://arigato.sharmbazaar.online/login.html" />
    <meta property="og:image" content="https://arigato.sharmbazaar.online/images/og-image.svg" />
    <meta property="og:image:alt" content="SMM Vault social media marketing panel" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sign in · SMM Vault" />
    <meta name="twitter:description" content="Sign in to manage your social media marketing campaigns." />
    <meta name="twitter:site" content="@smmvault" />
    <meta name="twitter:image" content="https://arigato.sharmbazaar.online/images/og-image.svg" />
    <link rel="canonical" href="https://arigato.sharmbazaar.online/login.html" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/seo.js"></script>
  </head>
  <body class="login-page">
    <main class="login-card">
      <div class="brand" style="color: #16352e">SMM<span>VAULT</span></div>
      <p class="eyebrow" style="margin-top: 45px">Welcome back</p>
      <h1>Sign in to your panel</h1>
      <p class="sub">Launch, track, and scale your social delivery.</p>
      <p id="error" class="hide" style="color: #d44"></p>
      <form onsubmit="submitAuth(event, 'login')" class="grid" style="margin-top: 24px">
        <div class="field"><label>Email</label><input name="email" type="email" required /></div>
        <div class="field">
          <label>Password</label><input name="password" type="password" required />
        </div>
        <button class="btn btn-dark">Sign in</button>
      </form>
      <p class="sub" style="margin-top: 20px">
        New here? <a href="/register.html">Create an account</a>
      </p>
    </main>
    <script src="/js/auth.js"></script>
  </body>
</html>
